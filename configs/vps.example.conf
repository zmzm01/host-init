# 配置按字面读取：KEY=value；不要加引号、行尾注释或 Shell 表达式。
# 相对公钥路径以本配置文件所在目录为基准。
ADMIN_USER=ops
SSH_PUBLIC_KEY_FILE=./id_ed25519.pub
TIMEZONE=Asia/Shanghai

# 留空保留原主机名；例如 vps-01。显式修改时同步 hosts，并保留 cloud-init 主机名。
SERVER_HOSTNAME=
# Debian 自带的英文 UTF-8；留空保留原 LANG，不更改其他 locale 分类。
SYSTEM_LOCALE=C.UTF-8
ENABLE_TIME_SYNC=yes
# 留空沿用已有 NTP 上游；自定义列表只用于 systemd-timesyncd。
NTP_SERVERS=

# 0 不创建；小内存 VPS 可选 1024/2048 MiB。已有 Swap 则保留，不自动扩容。
SWAP_SIZE_MB=0
INSTALL_MONITORING_TOOLS=yes
ENABLE_SYSSTAT_HISTORY=yes
SYSSTAT_HISTORY_DAYS=7
# VPS 设备支持与云厂商策略各异，按需启用。
ENABLE_FSTRIM=no
INSTALL_BACKUP_TOOLS=no
INSTALL_HARDWARE_TOOLS=no

# yes：管理员仅用公钥登录，sudo 不需要密码（拥有完整 root 权限）。
# no：新用户初始化时交互设置密码；已有用户必须已经有密码。
PASSWORDLESS_SUDO=yes

# 全系统升级默认关闭；保持云镜像原有 APT 源。
UPGRADE_PACKAGES=no
INSTALL_DOCKER=yes
INSTALL_FAIL2BAN=yes
INSTALL_SECURITY_HARDENING=yes
ENABLE_UNATTENDED_UPGRADES=yes
INSTALL_COMMON_TOOLS=yes
EXTRA_PACKAGES=

# 安装后首次执行 sudo tailscale up 登录；账号密钥不放进配置文件。
INSTALL_TAILSCALE=yes
# 默认不额外打开 UDP 入站；如需直连，可填实际 tailscaled 端口（通常 41641）。
TAILSCALE_UDP_PORT=

# docker 组等同 root 权限；默认通过 sudo docker 操作。
DOCKER_ADD_ADMIN_TO_GROUP=no

# 额外放行的主机端口，以空格分隔；实际 SSH 端口会自动放行。
# 例如 ALLOW_TCP_PORTS=80 443
# 重跑只补齐放行规则，不删除既有防火墙规则。
ALLOW_TCP_PORTS=
ALLOW_UDP_PORTS=

# 所有机器共用这些可选服务；VPS 默认关闭，可按需启用。
INSTALL_SYNCTHING=no
SYNCTHING_USER=syncthing
INSTALL_NGINX=no
INSTALL_MIHOMO=no
SERVICE_LAN_CIDR=
MIHOMO_DIR=/opt/mihomo
