# 家庭服务器配置示例，适用于 H81 和其他 Debian 主机。
# 格式是字面 KEY=value，不加引号/行尾注释。
# 相对公钥路径以本配置文件所在目录为基准。
ADMIN_USER=ops
SSH_PUBLIC_KEY_FILE=./id_ed25519.pub
TIMEZONE=Asia/Shanghai
SERVER_HOSTNAME=
SYSTEM_LOCALE=C.UTF-8
ENABLE_TIME_SYNC=yes
NTP_SERVERS=
SWAP_SIZE_MB=0
INSTALL_MONITORING_TOOLS=yes
ENABLE_SYSSTAT_HISTORY=yes
SYSSTAT_HISTORY_DAYS=7
# 启用发行版定期 TRIM；不会执行 blkdiscard 或修改磁盘布局。
ENABLE_FSTRIM=yes
INSTALL_BACKUP_TOOLS=yes
INSTALL_HARDWARE_TOOLS=yes
PASSWORDLESS_SUDO=yes
UPGRADE_PACKAGES=no
INSTALL_DOCKER=yes
DOCKER_ADD_ADMIN_TO_GROUP=no
INSTALL_FAIL2BAN=yes
INSTALL_SECURITY_HARDENING=yes
ENABLE_UNATTENDED_UPGRADES=yes
INSTALL_COMMON_TOOLS=yes
# 默认 Zellij；也支持 tmux 或 none，不卸载已经安装的工具。
TERMINAL_MULTIPLEXER=zellij
EXTRA_PACKAGES=
INSTALL_TAILSCALE=yes
TAILSCALE_UDP_PORT=
ALLOW_TCP_PORTS=
ALLOW_UDP_PORTS=

# 默认启用文件同步；网页服务及代理按需打开。
INSTALL_SYNCTHING=yes
SYNCTHING_USER=syncthing
INSTALL_NGINX=no
INSTALL_MIHOMO=no

# 选填实际私有 IPv4 网段，例如 192.168.1.0/24。
# 填写后仅向该网段开放同步端口、及选中的 Nginx 80/443。
# 留空时不额外放行这些端口，可先通过 SSH 隧道/Tailscale 管理。
SERVICE_LAN_CIDR=

# 只运行你已经验证并放置的本机二进制，不自动下载未知版本。
# 所需文件：/opt/mihomo/mihomo、/opt/mihomo/config/config.yaml。
MIHOMO_DIR=/opt/mihomo
